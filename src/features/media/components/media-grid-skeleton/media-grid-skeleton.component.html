<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
  @for (_ of skeletonItems; track $index) {
    <div class="overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-sm">
      <div class="h-56 animate-pulse bg-zinc-100"></div>

      <div class="space-y-4 p-4">
        <div>
          <div class="h-4 w-3/4 animate-pulse rounded bg-zinc-200"></div>
          <div class="mt-2 h-3 w-full animate-pulse rounded bg-zinc-100"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          @for (_ of [1, 2, 3, 4]; track $index) {
            <div>
              <div class="mb-2 h-3 w-14 animate-pulse rounded bg-zinc-100"></div>
              <div class="h-3 w-20 animate-pulse rounded bg-zinc-200"></div>
            </div>
          }
        </div>

        <div class="flex flex-wrap gap-1.5">
          <div class="h-6 w-14 animate-pulse rounded-full bg-zinc-100"></div>
          <div class="h-6 w-20 animate-pulse rounded-full bg-zinc-100"></div>
          <div class="h-6 w-16 animate-pulse rounded-full bg-zinc-100"></div>
        </div>
      </div>
    </div>
  }
</div>
