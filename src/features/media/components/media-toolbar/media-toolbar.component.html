<div class="flex justify-between">
  <div class="left-side flex-1">
    <md-media-search (searchChanged)="changedSearchValue($event)" [searchValue]="searchValue()" />
    <md-media-total-count [filteredCount]="filteredCount()" [totalCount]="totalCount()" />
  </div>
  <div class="right-side">
    <md-media-filter
      (filterChanged)="changedFilterValue($event)"
      [filterValue]="filterValue()"
      [filterItems]="filterItems()"
    />
  </div>
</div>
